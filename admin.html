<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Jilan Store Orders</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;margin:0;padding:14px}
h1{color:#1a5c3f;font-size:20px}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.badge{background:#e8f5e9;color:#1a5c3f;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.done{background:#ddd;color:#555}
table{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}
td{padding:5px 4px;border-bottom:1px solid #eee;vertical-align:top}
button{background:#1a5c3f;color:#fff;border:none;padding:8px 14px;border-radius:8px;margin-top:8px}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
#login{max-width:320px;margin:60px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.hidden{display:none}
.src{font-size:11px;color:#888;word-break:break-all}
</style>
</head>
<body>
<div id="login">
<h1>🔐 Admin Login</h1>
<input type="password" id="pw" placeholder="Password">
<button onclick="doLogin()" style="width:100%">Login</button>
<p style="font-size:12px;color:#888">Default password: <b>jilan123</b> (change it in admin.html)</p>
</div>
<div id="panel" class="hidden">
<h1>📦 Jilan Store — Orders <span id="cnt"></span></h1>
<button onclick="loadOrders()">🔄 Refresh</button>
<div id="orders"><p>Loading...</p></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
// ===== FIREBASE CONFIG — apni details yahan paste karein =====
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT"
};
// =============================================================
const ADMIN_PW = "jilan123";
let db = null;
function doLogin(){
  if(document.getElementById('pw').value === ADMIN_PW){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    try{
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      loadOrders();
    }catch(e){
      document.getElementById('orders').innerHTML = '<p style="color:red">Firebase config missing! Pehle firebaseConfig me apni details paste karein.</p>';
    }
  } else alert('Ghalat password!');
}
function loadOrders(){
  if(!db) return;
  db.ref('orders').orderByChild('time').limitToLast(50).once('value', snap => {
    const data = snap.val() || {};
    const keys = Object.keys(data).reverse();
    document.getElementById('cnt').textContent = '(' + keys.length + ')';
    if(!keys.length){ document.getElementById('orders').innerHTML = '<p>Koi order nahi mila.</p>'; return; }
    document.getElementById('orders').innerHTML = keys.map(k => {
      const o = data[k];
      const items = (o.items||[]).map(i => i.name + ' ×' + i.qty + ' (Rs ' + i.price + ')').join('<br>');
      return '<div class="card"><div class="top"><b>' + (o.name||'-') + '</b>' +
        '<span class="badge' + (o.status==='done'?' done':'') + '">' + (o.status||'new') + '</span></div>' +
        '<table><tr><td>📱</td><td>' + (o.phone||'-') + '</td></tr>' +
        '<tr><td>📍</td><td>' + (o.city||'') + ', ' + (o.address||'') + '</td></tr>' +
        '<tr><td>🛒</td><td>' + items + '</td></tr>' +
        '<tr><td>💰</td><td><b>Rs ' + (o.total||0) + '</b> (COD)</td></tr>' +
        '<tr><td>🕐</td><td>' + new Date(o.time).toLocaleString() + '</td></tr></table>' +
        (o.src ? '<div class="src">🔗 Source: ' + o.src + '</div>' : '') +
        '<button onclick="markDone(\'' + k + '\')">✅ Done</button></div>';
    }).join('');
  });
}
function markDone(k){
  db.ref('orders/' + k).update({status:'done'}).then(loadOrders);
}
</script>
</body>
</html>
