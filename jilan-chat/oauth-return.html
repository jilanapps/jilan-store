<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jilan Chat — returning to the app...</title>
<style>
  body { font-family: sans-serif; background: #f0f2f5; color: #111b21; margin: 0; padding: 40px 20px; text-align: center; }
  a.btn { display: inline-block; margin-top: 20px; padding: 14px 24px; background: #1f7ae0; color: #fff; text-decoration: none; border-radius: 8px; font-size: 18px; }
  p { font-size: 16px; }
</style>
</head>
<body>
<!-- Jilan Chat v2 — Google OAuth return page.
     Google can only redirect to a registered https:// URL, so the
     Android shell opens the OAuth page in the system browser and Google
     returns here. This page immediately forwards the URL fragment
     (id_token or error=) to the app via the custom scheme jilanchat://auth.
     If the browser blocks the automatic forward, the button below does it. -->
<p id="msg">Finishing sign-in. Returning to Jilan Chat...</p>
<a class="btn" id="backBtn" href="#">Back to Jilan Chat</a>
<script>
(function () {
  var frag = window.location.hash ? window.location.hash.substring(1) : "";
  var target = "jilanchat://auth#" + frag;
  // Tehreek Ittiba-e-Sunnat admin panel reuses this registered return URL.
  // Its state always starts with "tadmin." (Jilan Chat state is plain
  // alphanumeric), so only those returns go to the admin page on the web.
  var st = (/(?:^|&)state=([^&]*)/.exec(frag) || [])[1] || "";
  try { st = decodeURIComponent(st); } catch (e) {}
  if (st.indexOf("tadmin.") === 0) {
    window.location.replace("https://jilanapps.github.io/jilan-store/ittiba-e-sunnat/admin.html#" + frag);
    return;
  }
  var btn = document.getElementById("backBtn");
  btn.href = target;
  // Auto-forward right away; the button is the fallback if it is blocked.
  try { window.location.replace(target); } catch (e) {}
  setTimeout(function () {
    document.getElementById("msg").textContent =
      "If the app didn't open, tap the button below.";
  }, 1500);
})();
</script>
</body>
</html>
