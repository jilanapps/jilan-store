<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jilan Pizza Shop — DEMO by Jilan Apps</title>
<link rel="icon" href="img/logo.webp">
<style>
:root{
  --red:#c81e1e; --red-d:#a31515; --orange:#f97316; --orange-d:#ea580c;
  --cream:#fff8f0; --cream-d:#f5ead9; --ink:#2b1a12; --muted:#8a6f5c;
  --card:#ffffff; --line:#f0e2d0; --green:#15803d; --gold:#d4a017;
  --shadow:0 4px 18px rgba(200,30,30,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--cream); color:var(--ink); padding-bottom:76px}
body.rtl{direction:rtl}
.demo-bar{background:linear-gradient(90deg,var(--red),var(--orange)); color:#fff; text-align:center; font-weight:700; font-size:13px; padding:7px 10px; letter-spacing:.5px; position:sticky; top:0; z-index:60}
header.topbar{background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 60%,#7f1d1d 100%); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; position:sticky; top:29px; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.15)}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff}
.shop-name{font-size:18px;font-weight:800;line-height:1.1}
.shop-tag{font-size:11px;opacity:.9}
.topbar .sp{flex:1}
.lang-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.cart-btn{position:relative;background:#fff;color:var(--red);border:0;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.view{display:none;max-width:720px;margin:0 auto;padding:0 12px 20px}
.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hero{position:relative;border-radius:16px;overflow:hidden;margin:14px 0;box-shadow:var(--shadow)}
.hero img{width:100%;height:170px;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.65));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.hero h2{margin:0 0 4px;font-size:21px}
.hero p{margin:0;font-size:13px;opacity:.92}
.deals-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.deal-card{flex:0 0 230px;background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;border-radius:14px;padding:14px;scroll-snap-align:start;box-shadow:var(--shadow)}
.deal-card h4{margin:0 0 6px;font-size:15px}
.deal-card p{margin:0 0 10px;font-size:12px;opacity:.92}
.deal-card button{background:#fff;color:var(--red);border:0;border-radius:20px;padding:8px 16px;font-weight:800;cursor:pointer;font-size:13px}
.sec-title{font-size:18px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.cat-pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.cat-pill{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.cat-pill.on{background:var(--red);border-color:var(--red);color:#fff}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;margin:2px 0 6px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;border:1px solid var(--line)}
.pcard .pimg{height:110px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#ffe8d6,#ffd9b8)}
.pcard .pbody{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard h4{margin:0;font-size:14px}
.pcard .desc{font-size:11px;color:var(--muted);margin:0;min-height:28px}
.pcard .price{font-weight:800;color:var(--red);font-size:14px}
.pcard .price small{color:var(--muted);font-weight:400;font-size:11px}
.add-btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px;font-weight:800;font-size:13px;cursor:pointer;margin-top:auto}
.add-btn:active{background:var(--red-d)}
.size-row{display:flex;gap:6px;flex-wrap:wrap}
.size-chip{border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;background:#fff}
.size-chip.on{background:var(--red);color:#fff;border-color:var(--red)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--cream);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(40px)}to{}}
.modal h3{margin:0 0 4px;font-size:17px}
.opt-group{margin:12px 0}
.opt-group h5{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.opt-list{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600}
.opt.on{border-color:var(--red);background:#fff0ec;color:var(--red)}
.opt small{color:var(--muted)}
.qty-row{display:flex;align-items:center;gap:14px;margin:14px 0}
.qty-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;font-weight:800;color:var(--red)}
.qty-num{font-size:19px;font-weight:800;min-width:30px;text-align:center}
.total-line{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
.btn-red{background:var(--red);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn + .btn{margin-top:10px}
/* cart */
.citem{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.citem .t{font-weight:800;font-size:14px}
.citem .d{font-size:12px;color:var(--muted);margin:3px 0}
.citem .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.citem .p{font-weight:800;color:var(--red)}
.rm{color:var(--red);background:none;border:0;font-size:13px;cursor:pointer;font-weight:700}
.sum{background:var(--card);border-radius:12px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.sum .r{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.sum .g{font-size:17px;font-weight:800;border-top:1px dashed var(--line);padding-top:8px;margin-top:6px;color:var(--red)}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty .e{font-size:54px}
/* forms */
.form label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.form input,.form select,.form textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg .opt{flex:1;text-align:center}
/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-it{flex:1;text-align:center;padding:9px 4px 7px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:700;border:0;background:none}
.nav-it .ic{font-size:21px;display:block}
.nav-it.on{color:var(--red)}
/* orders */
.oitem{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.oitem .h{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:12px;background:#fef3c7;color:#92400e}
.badge.prep{background:#dbeafe;color:#1e40af}
.badge.done{background:#dcfce7;color:#166534}
.badge.cancel{background:#fee2e2;color:#991b1b}
/* admin */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dcard{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.dcard .v{font-size:20px;font-weight:800;color:var(--red)}
.dcard .l{font-size:12px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{background:var(--cream-d);font-size:12px}
.st-sel{padding:6px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.note{background:#fff7e6;border:1px solid #f5d78e;border-radius:10px;padding:10px 12px;font-size:12px;color:#7a5b00;margin:10px 0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2b1a12;color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:200;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.conf-box{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:16px}
.conf-box .big{font-size:52px}
.ord-no{font-size:20px;font-weight:800;color:var(--red);letter-spacing:1px;margin:8px 0}
</style>
</head>
<body>
<div class="demo-bar">🍕 DEMO by Jilan Apps — Sample prices, demo data only</div>
<header class="topbar">
  <img class="logo" src="img/logo.webp" alt="logo" onerror="this.style.display='none'">
  <div><div class="shop-name" id="shopName">Jilan Pizza Shop</div><div class="shop-tag" data-i18n="tag">Hot & Fresh Pizzas</div></div>
  <div class="sp"></div>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">اردو</button>
  <button class="cart-btn" onclick="go('cart')">🛒<span class="cart-count" id="cartCount">0</span></button>
</header>

<!-- HOME -->
<div class="view active" id="v-home">
  <div class="hero"><img src="img/hero.jpg" alt="pizzas" onerror="this.parentNode.style.background='linear-gradient(135deg,#c81e1e,#f97316)';this.remove()">
    <div class="ov"><h2 data-i18n="heroT">Fresh, Hot & Cheesy! 🍕</h2><p data-i18n="heroS">Order your favorite pizzas in minutes</p></div>
  </div>
  <div class="sec-title">🔥 <span data-i18n="deals">Today's Deals</span></div>
  <div class="deals-row" id="dealsRow"></div>
  <div class="sec-title">⭐ <span data-i18n="popular">Popular Pizzas</span></div>
  <div class="grid" id="popularGrid"></div>
</div>

<!-- MENU -->
<div class="view" id="v-menu">
  <input class="search" id="menuSearch" data-i18n-ph="searchPh" placeholder="Search pizzas, sides..." oninput="renderMenu()">
  <div class="cat-pills" id="catPills"></div>
  <div class="grid" id="menuGrid"></div>
</div>

<!-- CART -->
<div class="view" id="v-cart">
  <div class="sec-title">🛒 <span data-i18n="cart">Your Cart</span></div>
  <div id="cartList"></div>
  <div class="sum" id="cartSum" style="display:none"></div>
  <button class="btn btn-red" id="checkoutBtn" style="display:none" onclick="go('checkout')" data-i18n="checkout">Proceed to Checkout →</button>
</div>

<!-- CHECKOUT -->
<div class="view" id="v-checkout">
  <div class="sec-title">📋 <span data-i18n="checkoutT">Checkout</span></div>
  <div class="form">
    <label data-i18n="name">Full Name *</label><input id="co-name" placeholder="Muhammad Asif">
    <label data-i18n="mobile">Mobile Number *</label><input id="co-mobile" inputmode="tel" placeholder="0300 1234567">
    <label data-i18n="address">Delivery Address *</label><textarea id="co-addr" rows="2" placeholder="House, street, area"></textarea>
    <label data-i18n="otype">Order Type</label>
    <div class="seg"><div class="opt on" data-v="delivery" onclick="pickSeg(this,'otype')" data-i18n="delivery">🛵 Delivery</div><div class="opt" data-v="pickup" onclick="pickSeg(this,'otype')" data-i18n="pickup">🏃 Pickup</div></div>
    <label data-i18n="pay">Payment</label>
    <div class="seg"><div class="opt on" data-v="cod" onclick="pickSeg(this,'pay')" data-i18n="cod">💵 Cash on Delivery</div><div class="opt" data-v="pickup-pay" onclick="pickSeg(this,'pay')" data-i18n="payshop">🏪 Pay at Shop</div></div>
    <label data-i18n="notes">Notes (optional)</label><input id="co-notes" data-i18n-ph="notesPh" placeholder="e.g. extra spicy, ring the bell">
  </div>
  <div class="sum" id="coSum"></div>
  <button class="btn btn-red" onclick="placeOrder()" data-i18n="place">✅ Place Order</button>
</div>

<!-- CONFIRM -->
<div class="view" id="v-confirm"><div id="confBox"></div></div>

<!-- ORDERS -->
<div class="view" id="v-orders">
  <div class="sec-title">📦 <span data-i18n="orders">My Orders</span></div>
  <div id="ordersList"></div>
</div>

<!-- ACCOUNT / ADMIN -->
<div class="view" id="v-account"><div id="accountBox"></div></div>

<nav class="bottom-nav">
  <button class="nav-it on" data-v="home" onclick="go('home')">🏠<span class="ic"></span><span data-i18n="nHome">Home</span></button>
  <button class="nav-it" data-v="menu" onclick="go('menu')">🍕<span data-i18n="nMenu">Menu</span></button>
  <button class="nav-it" data-v="cart" onclick="go('cart')">🛒<span data-i18n="nCart">Cart</span></button>
  <button class="nav-it" data-v="orders" onclick="go('orders')">📦<span data-i18n="nOrders">Orders</span></button>
  <button class="nav-it" data-v="account" onclick="go('account')">👤<span data-i18n="nAcc">Account</span></button>
</nav>

<!-- Product customize modal -->
<div class="modal-bg" id="pModal"><div class="modal" id="pModalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
