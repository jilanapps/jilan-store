<title>Islami Naam — Jilan Apps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b1120;color:#fff;min-height:100vh;padding:20px 14px 40px}
.wrap{max-width:520px;margin:0 auto}
h1{color:#e8b93c;font-size:22px;text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#8b95b8;font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:10px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid #e8b93c66;background:#1f2b4d;color:#e8b93c;border-radius:12px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}
.tabs button.on{background:#e8b93c;color:#0b1120}
.search{width:100%;background:#101a33;border:1px solid #2a3558;color:#fff;border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px}
.count{text-align:center;font-size:12px;color:#8b95b8;margin-bottom:10px}
.ncard{background:#101a33;border:1px solid #2a3558;border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ncard .nm{font-size:17px;font-weight:700}
.ncard .ur{font-size:15px;color:#e8b93c}
.ncard .mn{font-size:12.5px;color:#8b95b8;margin-top:3px}
.empty{text-align:center;color:#8b95b8;padding:24px;font-size:14px}
.note{text-align:center;font-size:11px;color:#5b6488;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>👶 Islami Naam</h1>
  <div class="sub">Bachon ke pyare naam — maani ke saath</div>
  <div class="tabs">
    <button id="tB" class="on" onclick="tab('B')">🤴 Larkay</button>
    <button id="tG" onclick="tab('G')">👸 Larkiyan</button>
  </div>
  <input class="search" id="q" placeholder="🔍 Naam talash karein..." oninput="render()">
  <div class="count" id="count"></div>
  <div id="list"></div>
  <div class="note">Naam ka intekhab walidain ki zimmedari hai — maani tehqeeq kar lein.<br>© 2026 Jilan Apps Official. All rights reserved.</div>
</div>

var cur="B";
function tab(t){
  cur=t;
  document.getElementById("tB").className=t==="B"?"on":"";
  document.getElementById("tG").className=t==="G"?"on":"";
  render();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var arr=cur==="B"?BOYS:GIRLS;
  var out=arr.filter(function(x){
    return !q||x[0].toLowerCase().indexOf(q)>-1||x[1].indexOf(document.getElementById("q").value.trim())>-1||x[2].toLowerCase().indexOf(q)>-1;
  });
  document.getElementById("count").textContent=out.length+" naam";
  var h=out.map(function(x){
    return '<div class="ncard"><div><div class="nm">'+esc(x[0])+' <span class="ur">'+esc(x[1])+'</span></div><div class="mn">'+esc(x[2])+'</div></div></div>';
  }).join("");
  document.getElementById("list").innerHTML=h||'<div class="empty">Koi naam nahi mila</div>';
}
render();
</script>
