<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7599547864631357" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jilan App Store</title>
<meta name="description" content="Jilan App Store — official apps by Jilan Apps Official. Download free Android apps: Islamic, tools, government services, games and more.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --green:#01875f; --green-dark:#01734f; --green-soft:#e6f4ea;
  --ink:#1f1f1f; --sub:#5f6368; --faint:#80868b;
  --line:#e8eaed; --pill:#f0f4f9; --hover:#f8f9fa;
  --radius-icon:22.5%;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,'Segoe UI',Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--ink);min-height:100vh;padding-bottom:76px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
img{display:block}
::-webkit-scrollbar{width:0;height:0}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;transition:box-shadow .2s}
header.scrolled{box-shadow:0 1px 6px rgba(32,33,36,.18)}
.tb{max-width:1120px;margin:auto;padding:10px 16px 8px;display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.wordmark{font-size:20px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;color:#3c4043}
.wordmark b{font-weight:700;color:var(--ink)}
.wordmark .play{color:var(--green)}
.searchpill{flex:1;max-width:560px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:0 16px;height:44px;border:1px solid transparent}
.searchpill:focus-within{background:#fff;border-color:#d2e3fc;box-shadow:0 1px 6px rgba(32,33,36,.16)}
.searchpill svg{flex-shrink:0;opacity:.62}
.searchpill input{flex:1;border:0;background:transparent;font-size:15.5px;color:var(--ink);outline:none;min-width:0}
.searchpill input::placeholder{color:#5f6368}
#clearQ{display:none;border:0;background:transparent;font-size:19px;color:var(--sub);line-height:1;padding:2px}

/* ---------- chips ---------- */
.chips{position:sticky;top:63px;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.chips-in{max-width:1120px;margin:auto;display:flex;gap:8px;padding:9px 16px;overflow-x:auto;scrollbar-width:none}
.chip{flex-shrink:0;padding:7px 16px;border-radius:999px;border:1px solid #dadce0;background:#fff;color:#3c4043;font-size:13.5px;font-weight:500;transition:background .15s}
.chip:active{background:var(--hover)}
.chip.on{background:var(--green-soft);border-color:transparent;color:var(--green-dark);font-weight:600}

main{max-width:1120px;margin:auto;padding:0 16px}
.hidden{display:none!important}

/* ---------- update banner ---------- */
#updateCard{margin:14px 0 2px}
#updateCard .inner{background:var(--green-soft);border:1px solid #bfe6d2;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#updateCard .t{font-weight:600;font-size:15px}
#updateCard .s{font-size:13px;color:var(--sub);width:100%}
@media(min-width:560px){#updateCard .s{width:auto;flex:1}}

/* ---------- hero ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.sec-head h2{font-size:18px;font-weight:600;color:var(--ink)}
.sec-head .more{font-size:13.5px;color:var(--green);font-weight:600;border:0;background:none;padding:4px 2px}
.hero{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none}
.hero-card{scroll-snap-align:start;flex:0 0 86%;max-width:430px;border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;cursor:pointer;min-height:172px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 2px 10px rgba(0,0,0,.16)}
@media(min-width:700px){.hero-card{flex-basis:46%}}
.hero-card::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,255,255,.14),rgba(0,0,0,.28) 78%)}
.hero-bg{position:absolute;right:-26px;top:-26px;width:170px;height:170px;border-radius:26%;opacity:.16;transform:rotate(10deg)}
.hero-top{position:absolute;top:16px;left:20px;z-index:2;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.92}
.hero-main{position:relative;z-index:2;display:flex;gap:14px;align-items:center}
.hero-ic{width:64px;height:64px;border-radius:var(--radius-icon);overflow:hidden;background:rgba(255,255,255,.92);flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.hero-ic img{width:100%;height:100%;object-fit:cover}
.hero-ic .lt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700}
.hero-nm{font-size:19.5px;font-weight:600;line-height:1.2}
.hero-ds{font-size:13px;opacity:.88;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-act{position:relative;z-index:2;margin-top:14px;display:flex;align-items:center;gap:10px}
.hero-meta{font-size:12.5px;opacity:.85}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:600;border:0;text-decoration:none;transition:background .15s,filter .15s;white-space:nowrap}
.btn-install{background:var(--green);color:#fff;font-size:13.5px;padding:8px 22px}
.btn-install:active{background:var(--green-dark)}
.btn-outline{background:#fff;color:var(--green);border:1px solid #dadce0;font-size:13.5px;padding:7px 20px}
.btn-hero{background:#fff;font-size:13.5px;padding:8px 22px}
.btn-big{width:100%;max-width:460px;height:42px;font-size:15px;background:var(--green);color:#fff}
.btn-big.outline{background:#fff;color:var(--green);border:1px solid #dadce0}
.btn-big:active{background:var(--green-dark);color:#fff}
.pkgwrap{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.pkgwrap.big{display:flex;width:100%;max-width:460px}
.pkgwrap.big .btn-big{flex:1;width:auto}
.btn-busy{opacity:.72;pointer-events:none}
.btn-cancel{border-radius:999px;width:30px;height:30px;min-width:30px;padding:0;background:#f1f3f4;color:#5f6368;font-size:13px;border:1px solid #dadce0}
.btn-cancel:active{background:#e8eaed}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#202124;color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.show{opacity:1}

/* ---------- horizontal rows ---------- */
.hrow{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.hcard{flex:0 0 96px;width:96px;cursor:pointer}
.hcard .hic{width:96px;height:96px;border-radius:var(--radius-icon);overflow:hidden;background:#f1f3f4;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.hcard .hic img{width:100%;height:100%;object-fit:cover}
.hcard .hic .lt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#fff}
.hcard .hnm{font-size:13px;font-weight:500;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.hcard .hmt{font-size:11.5px;color:var(--sub);margin-top:2px}
.hcard .btn{margin-top:7px;padding:6px 16px;font-size:12.5px}

/* ---------- list rows (All apps / results) ---------- */
.lrow{display:flex;gap:14px;align-items:center;padding:11px 6px;border-radius:12px;cursor:pointer}
.lrow:active{background:var(--hover)}
.fillimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hic,.lic,.hero-ic,.d-ic{position:relative}
.lic{width:56px;height:56px;border-radius:var(--radius-icon);overflow:hidden;background:#f1f3f4;flex-shrink:0}
.lic img{width:100%;height:100%;object-fit:cover}
.lic .lt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}
.linfo{flex:1;min-width:0}
.lnm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.lds{font-size:12.5px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmt{font-size:12px;color:var(--sub);margin-top:2px}
.badge{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.2px;flex-shrink:0}
.b-upd{background:#fef7e0;color:#b06000;border:1px solid #f3d38a}
.b-ok{background:var(--green-soft);color:var(--green-dark)}
.count{font-size:13.5px;color:var(--sub);margin:16px 0 4px}
.empty{padding:56px 0;text-align:center;color:var(--sub);font-size:15px}
.empty .big{font-size:38px;margin-bottom:10px}

/* ---------- detail ---------- */
#detailView{max-width:820px}
.d-back{display:flex;align-items:center;gap:4px;border:0;background:none;font-size:14.5px;color:#3c4043;font-weight:500;padding:14px 0 4px}
.d-head{display:flex;gap:18px;margin-top:10px;align-items:flex-start}
.d-ic{width:96px;height:96px;border-radius:var(--radius-icon);overflow:hidden;background:#f1f3f4;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.d-ic img{width:100%;height:100%;object-fit:cover}
.d-ic .lt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff}
.d-nm{font-size:23px;font-weight:600;line-height:1.25}
.d-dev{color:var(--green);font-size:14.5px;font-weight:600;margin-top:3px}
.d-sub{color:var(--sub);font-size:13px;margin-top:3px}
.d-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.d-chip{font-size:12px;font-weight:600;color:#3c4043;background:var(--pill);border-radius:8px;padding:5px 10px}
.d-chip.grn{background:var(--green-soft);color:var(--green-dark)}
.d-info{display:flex;margin:24px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-info>div{flex:1;text-align:center;padding:13px 4px}
.d-info>div+div{border-left:1px solid var(--line)}
.d-info .v{font-size:14.5px;font-weight:600}
.d-info .k{font-size:11.5px;color:var(--sub);margin-top:3px}
.d-install{margin:18px 0 6px}
.d-web{display:inline-block;margin-top:10px;font-size:14px;color:var(--green);font-weight:600}
.d-sec{margin-top:26px}
.d-sec h3{font-size:16.5px;font-weight:600;margin-bottom:9px}
.d-about{font-size:14.5px;line-height:1.65;color:#3c4043;white-space:pre-line}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #f1f3f4;font-size:13.5px}
.kv .k{color:var(--sub)}
.kv .v{font-weight:500;text-align:right;word-break:break-all}

/* ---------- footer / bottom nav ---------- */
footer{max-width:1120px;margin:36px auto 0;padding:20px 16px 8px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;text-align:center;line-height:1.9}
footer a{color:var(--green);font-weight:600}
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex}
#bottomNav button{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--sub);font-weight:500}
#bottomNav button.on{color:var(--green-dark);font-weight:700}
#bottomNav svg{display:block}
@media(min-width:900px){#bottomNav{display:none}body{padding-bottom:20px}}
</style>
</head>
<body>

<header id="topbar">
  <div class="tb">
    <img class="logo" src="icon-512.png" alt="Jilan Apps Official">
    <div class="wordmark"><b>Jilan</b> <span class="play">App Store</span></div>
    <div class="searchpill">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" fill="#5f6368"/></svg>
      <input id="q" type="search" placeholder="Search apps &amp; games" autocomplete="off">
      <button id="clearQ" aria-label="Clear search">✕</button>
    </div>
  </div>
</header>

<div class="chips"><div class="chips-in" id="chips"></div></div>

<main id="homeView">
  <div id="updateCard" class="hidden"><div class="inner">
    <div class="t">🎉 New version available!</div>
    <div class="s">Download the latest Jilan App Store update.</div>
    <span id="selfUpdSlot"></span>
  </div></div>
  <div id="heroWrap"></div>
  <div id="catRows"></div>
  <div class="sec-head"><h2>All apps</h2><span class="more" id="allCount"></span></div>
  <div id="allList"></div>
</main>

<main id="listView" class="hidden">
  <div class="count" id="listCount"></div>
  <div id="listResults"></div>
</main>

<main id="detailView" class="hidden"></main>

<footer>
  <a href="privacy-policy.html">Privacy Policy</a><br>
  © 2026 Jilan Apps Official. All rights reserved.
</footer>

<nav id="bottomNav">
  <button id="bnApps" class="on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" opacity=".9"/></svg>
    Apps
  </button>
  <button id="bnGames">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 16.09 18 6.5A3 3 0 0 0 15.19 4.5H8.81A3 3 0 0 0 6 6.5L2.42 16.09A2.5 2.5 0 0 0 6.2 19.4l2.12-2.12a2 2 0 0 1 1.41-.58H14.27a2 2 0 0 1 1.41.58l2.12 2.12a2.5 2.5 0 0 0 3.78-3.31zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4.25 1.13a.88.88 0 1 1 .88-.87.88.88 0 0 1-.87.87zm1.75-2.5a.88.88 0 1 1 .88-.88.88.88 0 0 1-.88.87z"/></svg>
    Games
  </button>
  <button id="bnSearch">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    Search
  </button>
</nav>

<div id="toast"></div>

<script>
const APP_VER="1.2";
const SELF_PKG="com.jilanapps.appstore";
const SELF_URL="https://jilanapps.github.io/jilan-store/app-store/jilan-app-store.apk";
let APPS=[],CAT="all",Q="";
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtSize=b=>!b?"":(b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB");
const CAT_ORDER=["islamic","tools","utility","games","apps","business","education","shopping","social","web"];
const CAT_LABEL={islamic:"Islamic",tools:"Tools & Services",utility:"Utilities",games:"Games",apps:"Apps",business:"Business",education:"Education",shopping:"Shopping",social:"Social",web:"Web Apps"};
const catLabel=c=>CAT_LABEL[c]||(c?c[0].toUpperCase()+c.slice(1):"Apps");

/* ---- native store-app bridge ---- */
const HAS_INSTALLER=!!(window.AppStore&&window.AppStore.installApp);
function installedVer(pkg){
  if(!pkg)return null;
  try{if(window.AppStore&&window.AppStore.getInstalledVersion){const v=window.AppStore.getInstalledVersion(pkg);return v||"";}}catch(e){}
  return null;
}
function installedCode(pkg){
  if(!pkg)return -2;
  try{if(window.AppStore&&window.AppStore.getInstalledVersionCode){const c=window.AppStore.getInstalledVersionCode(pkg);return (typeof c==="number")?c:-2;}}catch(e){}
  return -2; /* -1 = not installed (new bridge), -2 = unknown (old bridge/browser) */
}
function openApp(pkg){
  try{if(window.AppStore&&window.AppStore.openApp){window.AppStore.openApp(pkg);return true;}}catch(e){}
  return false;
}
let toastTimer=null;
function toast(msg){
  const t=$("toast");if(!t)return;
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---- in-app download state (Play-Store-style flow) ---- */
const DL={}; /* pkg -> {state, pct} : downloading | waiting | installing | ready */
function startInstall(id){
  const a=APPS.find(x=>x.id===id);
  if(!a||!a.package||!a.apk)return;
  DL[a.package]={state:"downloading",pct:0};
  paintApp(id);
  try{window.AppStore.installApp(a.package,a.apk,a.size||0);}
  catch(e){delete DL[a.package];paintApp(id);toast("Download start nahi ho saka");}
}
function cancelInstall(pkg){
  try{window.AppStore.cancelInstall(pkg);}catch(e){}
  delete DL[pkg];
  const a=APPS.find(x=>x.package===pkg);if(a)paintApp(a.id);
}
function promptInstall(pkg){
  try{window.AppStore.promptInstall(pkg);}catch(e){}
}
function selfInstall(){
  paintSelfBtn("downloading",0);
  try{window.AppStore.installApp(SELF_PKG,SELF_URL,0);}
  catch(e){paintSelfBtn();}
}
function paintSelfBtn(state,pct){
  const slot=$("selfUpdSlot");if(!slot)return;
  if(!HAS_INSTALLER){slot.innerHTML='<a class="btn btn-install" href="'+SELF_URL+'">Update</a>';return;}
  if(state==="downloading"){slot.innerHTML='<button class="btn btn-install btn-busy" disabled>Downloading…'+((pct!=null&&pct>=0)?" "+pct+"%":"")+'</button>';return;}
  if(state==="installing"){slot.innerHTML='<button class="btn btn-install btn-busy" disabled>Installing…</button>';return;}
  if(state==="waiting"){slot.innerHTML='<button class="btn btn-install btn-busy" disabled>Allow permission…</button>';return;}
  if(state==="ready"){slot.innerHTML='<button class="btn btn-install" onclick="promptInstall(\''+SELF_PKG+'\')">Install update</button>';return;}
  slot.innerHTML='<button class="btn btn-install" onclick="selfInstall()">Update</button>';
}
/* called by the native wrapper whenever a download/install state changes */
window.__onStoreDl=function(pkg,state,pct){
  if(pkg===SELF_PKG){paintSelfBtn(state,pct);return;}
  const a=APPS.find(x=>x.package===pkg);if(!a)return;
  if(state==="failed"){delete DL[pkg];}
  else DL[pkg]={state:state,pct:pct};
  paintApp(a.id);
};
/* called by the native wrapper on resume: re-sync states + installed versions */
window.__storeRefresh=function(){
  if(!HAS_INSTALLER)return;
  try{
    APPS.forEach(a=>{
      if(!a.apk||!a.package)return;
      let s="";try{s=window.AppStore.getInstallState(a.package)||"";}catch(e){}
      if(s==="idle"){if(DL[a.package]&&DL[a.package].state!=="downloading")delete DL[a.package];}
      else if(s.indexOf("downloading:")===0){DL[a.package]={state:"downloading",pct:parseInt(s.split(":")[1]||"0",10)};}
      else if(s==="ready"||s==="waiting"||s==="installing"){DL[a.package]={state:s,pct:0};}
    });
  }catch(e){}
  paintAll();
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)window.__storeRefresh();});
window.addEventListener("focus",()=>window.__storeRefresh());

/* ---- what the primary button should do for an app ---- */
function actionFor(a){
  if(a.apk){
    const c=installedCode(a.package);
    if(c===-1)return{kind:"install",url:a.apk};
    if(c>=0){
      if(a.versionCode&&c<a.versionCode)return{kind:"update",url:a.apk};
      return{kind:"open"};
    }
    const iv=installedVer(a.package);
    if(iv){
      if(iv===a.versionName)return{kind:"open"};
      return{kind:"update",url:a.apk};
    }
    return{kind:"install",url:a.apk};
  }
  return{kind:"webopen",url:a.web||"#"};

}
function badgeFor(a){
  const act=actionFor(a);
  if(act.kind==="open")return '<span class="badge b-ok">✓ Installed</span>';
  if(act.kind==="update")return '<span class="badge b-upd">Update available</span>';
  return "";
}
function btnHTML(a,style){
  return '<span class="pkgwrap'+(style==="big"?" big":"")+'" data-pkgbtn="'+esc(a.id)+'" data-style="'+esc(style||"")+'">'+btnInnerHTML(a,style)+'</span>';
}
function btnInnerHTML(a,style){
  const act=actionFor(a);
  const clsBase=style==="hero"?"btn btn-hero":(style==="big"?"btn btn-big":"btn btn-install");
  const heroStyle=style==="hero"?' style="color:#01734f"':"";
  if(act.kind==="open"){
    if(style==="big")return '<button class="btn btn-big outline" onclick="openApp(\''+esc(a.package)+'\')">Open</button>';
    if(style==="hero")return '<button class="btn btn-hero" style="color:#01734f" onclick="event.stopPropagation();openApp(\''+esc(a.package)+'\')">Open</button>';
    return '<button class="btn btn-outline" onclick="event.stopPropagation();openApp(\''+esc(a.package)+'\')">Open</button>';
  }
  if(act.kind==="webopen"){
    if(style==="big")return '<a class="btn btn-big" href="'+esc(act.url)+'" target="_blank">Open</a>';
    if(style==="hero")return '<a class="btn btn-hero" style="color:#01734f" href="'+esc(act.url)+'" target="_blank" onclick="event.stopPropagation()">Open</a>';
    return '<a class="btn btn-outline" href="'+esc(act.url)+'" target="_blank" onclick="event.stopPropagation()">Open</a>';
  }
  const label=act.kind==="update"?"Update":"Install";
  const dl=a.package?DL[a.package]:null;
  if(dl&&HAS_INSTALLER){
    if(dl.state==="downloading"){
      const pctTxt=(dl.pct!=null&&dl.pct>=0)?" "+dl.pct+"%":"";
      return '<button class="'+clsBase+' btn-busy" disabled'+heroStyle+'>Downloading…'+pctTxt+'</button>'
        +'<button class="btn-cancel" data-cancel="'+esc(a.package)+'" aria-label="Cancel download">✕</button>';
    }
    if(dl.state==="waiting")return '<button class="'+clsBase+' btn-busy" disabled'+heroStyle+'>Allow permission…</button>';
    if(dl.state==="installing")return '<button class="'+clsBase+' btn-busy" disabled'+heroStyle+'>Installing…</button>';
    if(dl.state==="ready")return '<button class="'+clsBase+'" data-prompt="'+esc(a.package)+'" onclick="event.stopPropagation()"'+heroStyle+'>'+label+' now</button>';
  }
  if(HAS_INSTALLER&&a.package){
    return '<button class="'+clsBase+'" data-install="'+esc(a.id)+'" onclick="event.stopPropagation()"'+heroStyle+'>'+label+'</button>';
  }
  /* plain browser / old wrapper: direct APK download link (previous behaviour) */
  if(style==="big")return '<a class="btn btn-big" href="'+esc(act.url)+'">'+label+'</a>';
  return '<a class="'+clsBase+'" href="'+esc(act.url)+'" onclick="event.stopPropagation()"'+heroStyle+'>'+label+'</a>';
}
function paintApp(id){
  const a=APPS.find(x=>x.id===id);if(!a)return;
  document.querySelectorAll("[data-pkgbtn]").forEach(w=>{if(w.dataset.pkgbtn===id)w.innerHTML=btnInnerHTML(a,w.dataset.style||undefined);});
}
function paintAll(){
  document.querySelectorAll("[data-pkgbtn]").forEach(w=>{const a=APPS.find(x=>x.id===w.dataset.pkgbtn);if(a)w.innerHTML=btnInnerHTML(a,w.dataset.style||undefined);});
}
function iconInner(a,letterSize){
  const letter='<span class="lt" style="font-size:'+letterSize+'px">'+esc((a.name||"J")[0])+'</span>';
  if(a.icon)return letter+'<img class="fillimg" src="'+esc(a.icon)+'" alt="" loading="lazy" onerror="this.remove()">';
  return letter;
}
function iconBox(a,cls,letterSize){
  return '<div class="'+cls+'" style="background:'+esc(a.color||"#01875f")+'">'+iconInner(a,letterSize)+'</div>';
}
const metaLine=a=>esc("v"+(a.versionName||"1.0"))+(a.size?" • "+esc(fmtSize(a.size)):"");

/* ---------- card builders ---------- */
function heroHTML(a){
  return '<article class="hero-card" data-app="'+esc(a.id)+'" style="background:'+esc(a.color||"#01875f")+'">'
    +(a.icon?'<img class="hero-bg" src="'+esc(a.icon)+'" alt="">':'')
    +'<div class="hero-top">Featured</div>'
    +'<div class="hero-main">'+iconBox(a,"hero-ic",29)
    +'<div><div class="hero-nm">'+esc(a.name)+'</div><div class="hero-ds">'+esc(a.desc)+'</div></div></div>'
    +'<div class="hero-act">'+btnHTML(a,"hero")+'<span class="hero-meta">'+metaLine(a)+'</span></div>'
    +'</article>';
}
function hcardHTML(a){
  return '<div class="hcard" data-app="'+esc(a.id)+'">'+iconBox(a,"hic",40)
    +'<div class="hnm">'+esc(a.name)+'</div><div class="hmt">'+metaLine(a)+'</div>'
    +btnHTML(a)+'</div>';
}
function lrowHTML(a){
  return '<div class="lrow" data-app="'+esc(a.id)+'">'+iconBox(a,"lic",24)
    +'<div class="linfo"><div class="lnm">'+esc(a.name)+' '+badgeFor(a)+'</div>'
    +'<div class="lds">'+esc(a.desc)+'</div><div class="lmt">'+metaLine(a)+' • '+esc(catLabel(a.category))+'</div></div>'
    +btnHTML(a)+'</div>';
}

/* ---------- views ---------- */
function presentCats(){
  const have=new Set(APPS.map(a=>a.category));
  const ordered=CAT_ORDER.filter(c=>have.has(c));
  [...have].forEach(c=>{if(!ordered.includes(c))ordered.push(c);});
  return ordered;
}
function renderChips(){
  const cats=["all",...presentCats()];
  $("chips").innerHTML=cats.map(c=>'<button class="chip'+(CAT===c?" on":"")+'" data-cat="'+esc(c)+'">'+(c==="all"?"All":esc(catLabel(c)))+'</button>').join("");
  document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{applyCat(ch.dataset.cat);});
}
function showView(v){
  $("homeView").classList.toggle("hidden",v!=="home");
  $("listView").classList.toggle("hidden",v!=="list");
  $("detailView").classList.toggle("hidden",v!=="detail");
  document.querySelector(".chips").style.display=(v==="detail")?"none":"";
  window.scrollTo({top:0});
}
function renderHome(){
  const pref=["rahenoor","jilanaichat","jilanassistant","snakezone","virtualtradepro"];
  const byId=id=>APPS.find(a=>a.id===id);
  let hero=pref.map(byId).filter(Boolean);
  for(const a of APPS){if(hero.length>=5)break;if(!hero.includes(a))hero.push(a);}
  $("heroWrap").innerHTML=hero.length?'<div class="sec-head"><h2>Featured apps</h2></div><div class="hero">'+hero.map(heroHTML).join("")+'</div>':"";
  $("catRows").innerHTML=presentCats().map(c=>{
    const items=APPS.filter(a=>a.category===c).slice(0,14);
    if(!items.length)return "";
    return '<div class="sec-head"><h2>'+esc(catLabel(c))+'</h2><button class="more" data-more="'+esc(c)+'">More →</button></div><div class="hrow">'+items.map(hcardHTML).join("")+'</div>';
  }).join("");
  document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>applyCat(b.dataset.more));
  $("allCount").textContent=APPS.length+" apps";
  $("allList").innerHTML=APPS.map(lrowHTML).join("");
  showView("home");setNav("apps");
}
function renderList(items,title){
  $("listCount").textContent=title;
  $("listResults").innerHTML=items.length?items.map(lrowHTML).join(""):'<div class="empty"><div class="big">🔍</div>No apps found</div>';
  showView("list");
}
function applyCat(c){
  CAT=c;renderChips();
  if(Q){doSearch();return;}
  if(c==="all"){renderHome();return;}
  const items=APPS.filter(a=>a.category===c);
  renderList(items,catLabel(c)+" • "+items.length+" apps");
  setNav(c==="games"?"games":"apps");
}
function doSearch(){
  const items=APPS.filter(a=>((a.name||"")+" "+(a.desc||"")+" "+catLabel(a.category)).toLowerCase().includes(Q));
  renderList(items,items.length+' result'+(items.length===1?"":"s")+' for "'+Q+'"');
  setNav("search");
}
function setNav(which){
  $("bnApps").classList.toggle("on",which==="apps");
  $("bnGames").classList.toggle("on",which==="games");
  $("bnSearch").classList.toggle("on",which==="search");
}

/* ---------- detail ---------- */
function renderDetail(a){
  const similar=APPS.filter(x=>x.category===a.category&&x.id!==a.id).slice(0,12);
  const chips=['<span class="d-chip grn">Free</span>','<span class="d-chip">'+esc(catLabel(a.category))+'</span>','<span class="d-chip">v'+esc(a.versionName||"1.0")+'</span>',badgeFor(a)?'<span class="d-chip">'+(actionFor(a).kind==="open"?"Installed":"Update available")+'</span>':""].join("");
  $("detailView").innerHTML=
    '<button class="d-back" id="dBack">← Back</button>'
    +'<div class="d-head">'+iconBox(a,"d-ic",42)
    +'<div style="min-width:0"><div class="d-nm">'+esc(a.name)+'</div>'
    +'<div class="d-dev">Jilan Apps Official</div>'
    +'<div class="d-sub">'+esc(a.desc)+'</div>'
    +'<div class="d-chips">'+chips+'</div></div></div>'
    +'<div class="d-info"><div><div class="v">v'+esc(a.versionName||"1.0")+'</div><div class="k">Version</div></div>'
    +'<div><div class="v">'+esc(fmtSize(a.size)||"—")+'</div><div class="k">Size</div></div>'
    +'<div><div class="v">'+esc(catLabel(a.category))+'</div><div class="k">Category</div></div></div>'
    +'<div class="d-install">'+btnHTML(a,"big")
    +(a.apk&&a.web?'<br><a class="d-web" href="'+esc(a.web)+'" target="_blank">🌐 Open web version</a>':"")
    +'</div>'
    +'<div class="d-sec"><h3>About this app</h3><p class="d-about">'+esc(a.desc)+'</p></div>'
    +'<div class="d-sec"><h3>App info</h3>'
    +'<div class="kv"><span class="k">Version</span><span class="v">'+esc(a.versionName||"1.0")+'</span></div>'
    +'<div class="kv"><span class="k">Size</span><span class="v">'+esc(fmtSize(a.size)||"—")+'</span></div>'
    +'<div class="kv"><span class="k">Category</span><span class="v">'+esc(catLabel(a.category))+'</span></div>'
    +(a.package?'<div class="kv"><span class="k">Package</span><span class="v">'+esc(a.package)+'</span></div>':"")
    +'<div class="kv"><span class="k">Developer</span><span class="v">Jilan Apps Official</span></div></div>'
    +(similar.length?'<div class="d-sec"><h3>Similar apps</h3><div class="hrow">'+similar.map(hcardHTML).join("")+'</div></div>':"");
  $("dBack").onclick=()=>{if(history.length>1)history.back();else{location.hash="";}};
  showView("detail");
}
function route(){
  const m=(location.hash||"").match(/^#app\/(.+)$/);
  if(m){
    const a=APPS.find(x=>x.id===decodeURIComponent(m[1]));
    if(a){renderDetail(a);return;}
  }
  if(Q)doSearch();else if(CAT!=="all")applyCat(CAT);else renderHome();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const ci=e.target.closest("[data-install]");
  if(ci){e.stopPropagation();startInstall(ci.dataset.install);return;}
  const cc=e.target.closest("[data-cancel]");
  if(cc){e.stopPropagation();cancelInstall(cc.dataset.cancel);return;}
  const cp=e.target.closest("[data-prompt]");
  if(cp){e.stopPropagation();promptInstall(cp.dataset.prompt);return;}
  const t=e.target.closest("[data-app]");
  if(!t)return;
  if(e.target.closest(".btn"))return;
  location.hash="app/"+encodeURIComponent(t.dataset.app);
});
window.addEventListener("hashchange",route);
$("q").addEventListener("input",e=>{
  Q=e.target.value.trim().toLowerCase();
  $("clearQ").style.display=Q?"block":"none";
  if(location.hash)history.replaceState(null,"",location.pathname+location.search);
  if(Q)doSearch();else applyCat(CAT);
});
$("clearQ").onclick=()=>{$("q").value="";Q="";$("clearQ").style.display="none";applyCat(CAT);$("q").focus();};
$("bnApps").onclick=()=>{CAT="all";Q="";$("q").value="";$("clearQ").style.display="none";renderChips();renderHome();};
$("bnGames").onclick=()=>{applyCat("games");};
$("bnSearch").onclick=()=>{window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>$("q").focus(),250);};
window.addEventListener("scroll",()=>{$("topbar").classList.toggle("scrolled",window.scrollY>4);},{passive:true});

/* ---------- data ---------- */
async function selfUpdate(){
  try{
    const r=await fetch("appstore-version.json?t="+Date.now());
    if(!r.ok)return;const v=await r.json();
    const rv=v.versionName||v.version;
    if(rv&&rv!==APP_VER){$("updateCard").classList.remove("hidden");paintSelfBtn();}
  }catch(e){}
}
(async()=>{
  try{
    const r=await fetch("apps.json?t="+Date.now());
    const j=await r.json();
    APPS=j.apps||j||[];
  }catch(e){APPS=[];}
  renderChips();
  if((location.hash||"").startsWith("#app/"))route();else renderHome();
  selfUpdate();
})();
</script>
</body>
