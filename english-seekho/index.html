<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>English Bolna Seekho — Learn English with Urdu</title>
<style>
:root{--bg:#f5f7fb;--card:#ffffff;--txt:#1a2333;--mut:#6b7a90;--pri:#1a73e8;--acc:#ff8c1a;--ok:#2e9e5b;--bad:#e5484d;--line:#e3e8f0;--nav:#ffffff;--shadow:0 2px 12px rgba(20,40,80,.08)}
[data-theme=dark]{--bg:#0f1522;--card:#182130;--txt:#eef2f8;--mut:#9aa7bd;--line:#263146;--nav:#141b2a;--shadow:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,Roboto,'Noto Nastaliq Urdu',sans-serif;background:var(--bg);color:var(--txt);padding-bottom:76px;min-height:100vh}
.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori',serif;direction:rtl;text-align:right;line-height:2}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
header h1{font-size:19px;font-weight:800}
header .tag{font-size:11px;opacity:.85}
.hbtns{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;min-width:0}
.btn.acc{background:var(--acc)}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn.ok{background:var(--ok)}
.btn.big{width:100%;font-size:17px;padding:15px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
h2{font-size:19px;margin-bottom:10px}
h3{font-size:16px;margin:12px 0 8px}
.mut{color:var(--mut);font-size:13px}
.phrase{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.phrase .en{font-size:17px;font-weight:700;color:var(--pri)}
.phrase .roman{font-size:14px;color:var(--acc);font-weight:600;margin-top:2px}
.phrase .ur{font-size:16px;margin-top:4px}
.ex{background:var(--bg);border-left:4px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0;font-size:14px}
.quizopt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:15px;cursor:pointer;color:var(--txt)}
.quizopt.sel{border-color:var(--pri)}
.quizopt.right{border-color:var(--ok);background:rgba(46,158,91,.12)}
.quizopt.wrong{border-color:var(--bad);background:rgba(229,72,77,.12)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{padding:10px 16px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip{padding:7px 13px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lesson{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.lesson .num{background:linear-gradient(135deg,var(--pri),#0d47a1);color:#fff;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.lesson .t{flex:1}
.lesson .t b{font-size:15px}
.lesson.done{opacity:.75}
.lesson.done .num{background:var(--ok)}
.word{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.word .w{font-size:18px;font-weight:800;color:var(--pri)}
.word .m{font-size:15px;margin-top:2px}
.fav{float:right;font-size:22px;cursor:pointer;background:none;border:none}
input,select,textarea{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:var(--card);color:var(--txt);margin:6px 0}
input:focus{border-color:var(--pri);outline:none}
#bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:50;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
#bottomnav button{flex:1;background:none;border:none;padding:9px 2px 7px;font-size:10px;color:var(--mut);cursor:pointer;font-weight:600}
#bottomnav button .ic{font-size:21px;display:block}
#bottomnav button.on{color:var(--pri)}
.badge{display:inline-block;background:linear-gradient(135deg,#ff8c1a,#ff5e1a);color:#fff;border-radius:14px;padding:10px 14px;margin:5px;font-size:13px;font-weight:700}
.badge.lock{filter:grayscale(1);opacity:.45}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center;flex:1;min-width:100px;border:1px solid var(--line)}
.stat b{font-size:22px;color:var(--pri);display:block}
.stat span{font-size:12px;color:var(--mut)}
.streak{background:linear-gradient(135deg,#ff8c1a,#ff5e1a);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.streak b{font-size:34px;display:block}
.dlg{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.dlg .sp{font-weight:800;font-size:12px;color:var(--acc);text-transform:uppercase}
.dlg.mine{border-color:var(--pri);background:rgba(26,115,232,.07)}
.speakbtn{background:var(--acc);border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;flex-shrink:0}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}
.empty .e{font-size:48px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:6px}
.note{background:rgba(255,140,26,.12);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.hidden{display:none!important}
.wotd{background:linear-gradient(135deg,#1a73e8,#6a1ae8);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.wotd .w{font-size:26px;font-weight:800}
.rec{width:74px;height:74px;border-radius:50%;background:var(--bad);color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 4px 16px rgba(229,72,77,.4)}
.rec.live{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<header>
<div><h1 id="appTitle">📚 English Bolna Seekho</h1><div class="tag" id="appTag">Learn Daily. Speak Confidently.</div></div>
<div class="hbtns"><button class="hbtn" id="langBtn" onclick="toggleLang()">اردو</button><button class="hbtn" id="themeBtn" onclick="toggleTheme()">🌙</button></div>
</header>
<main id="view"></main>
<nav id="bottomnav"></nav>
<script>
/* ============ STATE ============ */
const SKEY='ebs_v1';
let S={done:{},scores:{},favs:[],learned:[],streak:{c:0,last:''},lang:'en',theme:'light',level:'beginner'};
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function touchStreak(){const t=todayStr();if(S.streak.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak.c=(S.streak.last===y)?S.streak.c+1:1;S.streak.last=t;save();}}
touchStreak();
/* ============ I18N ============ */
const T={
home:{en:'Home',ur:'ہوم'},lessons:{en:'Lessons',ur:'اسباق'},words:{en:'Words',ur:'الفاظ'},grammar:{en:'Grammar',ur:'گرامر'},talk:{en:'Talk',ur:'بات چیت'},quiz:{en:'Quiz',ur:'کوئز'},progress:{en:'Progress',ur:'پیش رفت'},
beginner:{en:'Beginner',ur:'ابتدائی'},intermediate:{en:'Intermediate',ur:'درمیانہ'},advanced:{en:'Advanced',ur:'اعلیٰ'},
};
function t(k){const v=T[k];return v?(v[S.lang]||v.en):k;}
function toggleLang(){S.lang=S.lang==='en'?'ur':'en';save();render();}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',S.theme);save();}
document.documentElement.setAttribute('data-theme',S.theme);
/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function speak(text,lang){try{const u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=.92;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){alert(S.lang==='ur'?'آواز دستیاب نہیں':'Voice not available');}}
function nav(){const items=[['home','🏠','home'],['lessons','📖','lessons'],['words','🔤','words'],['grammar','✏️','grammar'],['talk','💬','talk'],['quiz','❓','quiz'],['progress','🏆','progress']];$('bottomnav').innerHTML=items.map(i=>`<button class="${V===i[0]?'on':''}" onclick="go('${i[0]}')"><span class="ic">${i[1]}</span>${t(i[2])}</button>`).join('');}
let V='home',VP={};
let _lq=[],_lqi=0,_lqs=0,_gq=[],_gqi=0,_gqs=0;
function go(v,p){V=v;VP=p||{};render();window.scrollTo(0,0);}
function render(){nav();const R={home:rHome,lessons:rLessons,lesson:rLesson,words:rWords,grammar:rGrammar,grammard:rGrammarD,talk:rTalk,talkd:rTalkD,quiz:rQuiz,quizrun:rQuizRun,progress:rProgress};(R[V]||rHome)();}
/* lesson done helper */
function markDone(id){S.done[id]=true;touchStreak();save();}
function learnedCount(){return Object.keys(S.done).length;}
/* ============ HOME ============ */
function rHome(){const done=learnedCount();const wotd=VOCAB[Math.floor(Date.now()/864e5)%VOCAB.length];
const daily=LESSONS[Math.floor(Date.now()/864e5)%LESSONS.length];
$('view').innerHTML=`
<div class="streak">🔥 <b>${S.streak.c}</b>${S.lang==='ur'?'دن کی لگاتار محنت':'day learning streak'}</div>
<div class="card"><h2>${S.lang==='ur'?'خوش آمدید!':'Welcome!'}</h2>
<p class="mut">${S.lang==='ur'?'آج کچھ نیا سیکھیں':'Learn something new today'}</p>
<div class="bar"><i style="width:${Math.min(100,done/30*100)}%"></i></div>
<p class="mut">${done}/30 ${S.lang==='ur'?'اسباق مکمل':'lessons done'}</p>
<div class="row" style="margin-top:10px"><button class="btn acc big" onclick="go('lessons')">📖 ${S.lang==='ur'?'سیکھنا جاری رکھیں':'Continue Learning'}</button></div></div>
<div class="wotd"><div class="mut" style="color:#fff;opacity:.8">📅 ${S.lang==='ur'?'آج کا لفظ':'Word of the Day'}</div>
<div class="w">${esc(wotd[0])}</div><div class="ur" style="color:#fff">${esc(wotd[1])}</div>
<div style="font-size:13px;opacity:.85">${esc(wotd[2])} • ${esc(wotd[4])}</div>
<button class="hbtn" style="margin-top:8px" onclick="speak('${esc(wotd[0])}')">🔊 ${S.lang==='ur'?'سنیں':'Listen'}</button></div>
<div class="card"><h2>📖 ${S.lang==='ur'?'آج کا سبق':'Daily Lesson'}</h2>
<p><b>${esc(daily.te)}</b></p><p class="ur mut">${esc(daily.tu)}</p>
<button class="btn sm" onclick="go('lesson',{id:'${daily.id}'})">${S.lang==='ur'?'شروع کریں':'Start'} →</button></div>
<div class="row">
<div class="card" style="flex:1;min-width:140px;text-align:center;cursor:pointer" onclick="go('words')"><div style="font-size:32px">🔤</div><b>${t('words')}</b></div>
<div class="card" style="flex:1;min-width:140px;text-align:center;cursor:pointer" onclick="go('talk')"><div style="font-size:32px">💬</div><b>${t('talk')}</b></div>
<div class="card" style="flex:1;min-width:140px;text-align:center;cursor:pointer" onclick="go('quiz')"><div style="font-size:32px">❓</div><b>${t('quiz')}</b></div>
</div>`;}
/* ============ LESSONS ============ */
let LL='beginner';
function rLessons(){const lv=['beginner','intermediate','advanced'];
$('view').innerHTML=`<h2>📖 ${t('lessons')}</h2><div class="tabs">${lv.map(l=>`<button class="tab ${LL===l?'on':''}" onclick="LL='${l}';rLessons()">${t(l)}</button>`).join('')}</div>
${LESSONS.filter(l=>l.level===LL).map((l,i)=>`<div class="lesson ${S.done[l.id]?'done':''}" onclick="go('lesson',{id:'${l.id}'})"><div class="num">${S.done[l.id]?'✓':i+1}</div><div class="t"><b>${esc(l.te)}</b><br><span class="mut ur">${esc(l.tu)}</span></div><div>→</div></div>`).join('')}`;}
function rLesson(){const l=LESSONS.find(x=>x.id===VP.id);if(!l)return go('lessons');
$('view').innerHTML=`<button class="btn sm ghost" onclick="go('lessons')">← ${t('lessons')}</button>
<div class="card" style="margin-top:10px"><h2>${esc(l.te)}</h2><p class="ur mut">${esc(l.tu)}</p>
<h3>📝 ${S.lang==='ur'?'جملے':'Phrases'}</h3>
${l.ph.map(p=>`<div class="phrase"><div class="row"><div class="en" style="flex:1">${esc(p.en)}</div><button class="speakbtn" onclick="speak('${esc(p.en).replace(/'/g,"\\'")}')">🔊</button></div>${p.roman?`<div class="roman">${esc(p.roman)}</div>`:''}<div class="ur">${esc(p.ur)}</div></div>`).join('')}
<h3>💡 ${S.lang==='ur'?'وضاحت':'Explanation'}</h3><p>${esc(S.lang==='ur'?l.xu:l.xe)}</p>
<h3>📌 ${S.lang==='ur'?'مثالیں':'Examples'}</h3>${l.ex.map(e=>`<div class="ex"><b>${esc(e.en)}</b><br><span class="ur">${esc(e.ur)}</span></div>`).join('')}
<h3>❓ ${t('quiz')}</h3><div id="lq"></div>
<div class="row" style="margin-top:12px"><button class="btn ok big" onclick="markDone('${l.id}');rLesson()">${S.done[l.id]?'✅ ':'✓ '}${S.lang==='ur'?'مکمل! اگلا سبق':'Done! Next Lesson'}</button></div></div>`;
window._lq=l.qz;window._lqi=0;window._lqs=0;_lq=l.qz;_lqi=0;_lqs=0;renderLQuiz();}
function renderLQuiz(){const q=_lq[_lqi];if(!q){$('lq').innerHTML=`<div class="note">🎉 ${S.lang==='ur'?'اسکور':'Score'}: ${_lqs}/${_lq.length}</div>`;S.scores['lq_'+VP.id]=_lqs;save();return;}
$('lq').innerHTML=`<p><b>Q${_lqi+1}. ${esc(q.q)}</b></p>${q.o.map((o,i)=>`<button class="quizopt" id="qo${i}" onclick="ansLQuiz(${i},${q.a},'${esc(q.xu).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}<div id="lx"></div>`;}
function ansLQuiz(i,a,x){const opts=_lq[_lqi].o;opts.forEach((_,j)=>{$('qo'+j).classList.add(j===a?'right':(j===i?'wrong':''));$('qo'+j).onclick=null;});if(i===a)_lqs++;$('lx').innerHTML=`<div class="note">${i===a?'✅':'❌'} <span class="ur">${x}</span><br><button class="btn sm" style="margin-top:8px" onclick="_lqi++;renderLQuiz()">${S.lang==='ur'?'اگلا':'Next'} →</button></div>`;}
/* ============ WORDS ============ */
let WC='all',WQ='',WF=false;
function rWords(){const cats=['all','food','family','travel','business','shopping','education','daily'];
let list=VOCAB.filter(w=>(WC==='all'||w[4]===WC)&&(!WQ||w[0].toLowerCase().includes(WQ.toLowerCase())||w[1].includes(WQ))&&(!WF||S.favs.includes(w[0])));
$('view').innerHTML=`<h2>🔤 ${t('words')}</h2>
<input placeholder="${S.lang==='ur'?'لفظ تلاش کریں...':'Search word...'}" value="${esc(WQ)}" oninput="WQ=this.value;rWordsL()">
<div class="row" style="margin:8px 0;overflow-x:auto;flex-wrap:nowrap">${cats.map(c=>`<button class="chip ${WC===c?'on':''}" onclick="WC='${c}';rWords()">${c==='all'?(S.lang==='ur'?'سب':'All'):c}</button>`).join('')}<button class="chip ${WF?'on':''}" onclick="WF=!WF;rWords()">⭐ ${S.lang==='ur'?'پسندیدہ':'Fav'}</button></div>
<div id="wl"></div>`;rWordsL();}
function rWordsL(){const cats=['all'];let list=VOCAB.filter(w=>(WC==='all'||w[4]===WC)&&(!WQ||w[0].toLowerCase().includes(WQ.toLowerCase())||w[1].includes(WQ))&&(!WF||S.favs.includes(w[0])));
const el=$('wl');if(!el)return;
el.innerHTML=list.length?list.slice(0,60).map(w=>{const f=S.favs.includes(w[0]);return `<div class="word"><button class="fav" onclick="togFav('${esc(w[0])}')">${f?'⭐':'☆'}</button><div class="row"><div class="w" style="flex:1">${esc(w[0])}</div><button class="speakbtn" style="width:36px;height:36px;font-size:16px" onclick="speak('${esc(w[0])}')">🔊</button></div><div class="m ur">${esc(w[1])}</div><div class="mut">${esc(w[2])} • ${esc(w[4])}</div><div class="ex">${esc(w[3])}</div></div>`;}).join(''):`<div class="empty"><div class="e">🔍</div>${S.lang==='ur'?'کچھ نہیں ملا':'Nothing found'}</div>`;}
function togFav(w){const i=S.favs.indexOf(w);if(i>=0)S.favs.splice(i,1);else S.favs.push(w);save();rWordsL();}
/* ============ GRAMMAR ============ */
function rGrammar(){$('view').innerHTML=`<h2>✏️ ${t('grammar')}</h2>${GRAMMAR.map((g,i)=>`<div class="lesson" onclick="go('grammard',{id:'${g.id}'})"><div class="num">${i+1}</div><div class="t"><b>${esc(g.te)}</b><br><span class="mut ur">${esc(g.tu)}</span></div><div>→</div></div>`).join('')}`;}
function rGrammarD(){const g=GRAMMAR.find(x=>x.id===VP.id);if(!g)return go('grammar');
$('view').innerHTML=`<button class="btn sm ghost" onclick="go('grammar')">← ${t('grammar')}</button><div class="card" style="margin-top:10px"><h2>${esc(g.te)}</h2><p class="ur mut">${esc(g.tu)}</p><p style="margin:10px 0">${esc(S.lang==='ur'?g.cu:g.ce)}</p><h3>✏️ ${S.lang==='ur'?'مشق':'Exercises'}</h3><div id="gq"></div></div>`;
window._gq=g.exr;window._gqi=0;window._gqs=0;_gq=g.exr;_gqi=0;_gqs=0;renderGQuiz();}
function renderGQuiz(){const q=_gq[_gqi];if(!q){$('gq').innerHTML=`<div class="note">🎉 ${S.lang==='ur'?'اسکور':'Score'}: ${_gqs}/${_gq.length}</div>`;return;}
$('gq').innerHTML=`<p><b>Q${_gqi+1}. ${esc(q.q)}</b></p>${q.o.map((o,i)=>`<button class="quizopt" id="go${i}" onclick="ansGQuiz(${i},${q.a},'${esc(q.x).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}<div id="gx"></div>`;}
function ansGQuiz(i,a,x){_gq[_gqi].o.forEach((_,j)=>{$('go'+j).classList.add(j===a?'right':(j===i?'wrong':''));$('go'+j).onclick=null;});if(i===a)_gqs++;$('gx').innerHTML=`<div class="note">${i===a?'✅':'❌'} <span class="ur">${x}</span><br><button class="btn sm" style="margin-top:8px" onclick="_gqi++;renderGQuiz()">${S.lang==='ur'?'اگلا':'Next'} →</button></div>`;}
/* ============ TALK ============ */
function rTalk(){$('view').innerHTML=`<h2>💬 ${t('talk')}</h2><p class="mut">${S.lang==='ur'?'روزمرہ گفتگو کی مشق':'Practice everyday conversations'}</p>${CONVOS.map(c=>`<div class="lesson" onclick="go('talkd',{id:'${c.id}'})"><div class="num">💬</div><div class="t"><b>${esc(c.te)}</b><br><span class="mut ur">${esc(c.tu)}</span></div><div>→</div></div>`).join('')}
<div class="card"><h2>🎤 ${S.lang==='ur'?'بولنے کی مشق':'Speaking Practice'}</h2><p class="mut">${S.lang==='ur'?'کوئی جملہ چنیں اور بول کر مشق کریں':'Pick a line and practice speaking'}</p><button class="btn acc big" onclick="go('talkd',{id:'c1',speak:true})">🎤 ${S.lang==='ur'?'شروع کریں':'Start'}</button></div>`;}
let TROLE='A';
function rTalkD(){const c=CONVOS.find(x=>x.id===VP.id);if(!c)return go('talk');
$('view').innerHTML=`<button class="btn sm ghost" onclick="go('talk')">← ${t('talk')}</button><div class="card" style="margin-top:10px"><h2>${esc(c.te)}</h2><p class="ur mut">${esc(c.tu)}</p>
<div class="row"><span class="mut">${S.lang==='ur'?'آپ کا کردار':'Your role'}:</span><button class="tab ${TROLE==='A'?'on':''}" onclick="TROLE='A';rTalkD()">A</button><button class="tab ${TROLE==='B'?'on':''}" onclick="TROLE='B';rTalkD()">B</button></div>
${c.lines.map(l=>`<div class="dlg ${l[0]===TROLE?'mine':''}"><div class="sp">🧑 ${l[0]} ${l[0]===TROLE?(S.lang==='ur'?'(آپ)':'(You)'):''}</div><div class="row"><div style="flex:1"><b>${esc(l[1])}</b><div class="roman" style="color:var(--acc);font-size:13px">${esc(l[3])}</div><div class="ur">${esc(l[2])}</div></div><button class="speakbtn" onclick="speak('${esc(l[1]).replace(/'/g,"\\'")}')">🔊</button></div>
${l[0]===TROLE?`<div class="row" style="margin-top:8px"><button class="btn sm acc" onclick="practiceSay('${esc(l[1]).replace(/'/g,"\\'")}')">🎤 ${S.lang==='ur'?'بول کر مشق':'Practice Speaking'}</button></div><div id="spk"></div>`:''}</div>`).join('')}
<div class="note">💡 ${S.lang==='ur'?'پہلے سنیں، پھر دہرائیں۔ مائیک صرف بولنے کی مشق پر مانگا جائے گا۔ AI اسکورنگ نہیں — صرف مشق۔':'Listen first, then repeat. Mic is asked only for speaking practice. No AI scoring — practice only.'}</div></div>`;}
let recog=null;
function practiceSay(expected){const box=$('spk');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){box.innerHTML=`<div class="note">⚠️ ${S.lang==='ur'?'اس براؤزر میں آواز پہچان نہیں ہے۔ اونچی آواز میں خود دہرائیں۔':'Speech recognition not supported here. Repeat aloud yourself.'}</div>`;return;}
box.innerHTML=`<div class="note">🎤 ${S.lang==='ur'?'بولیں...':'Speak now...'}</div>`;
try{recog=new SR();recog.lang='en-US';recog.onresult=e=>{const said=e.results[0][0].transcript;box.innerHTML=`<div class="note">🗣️ ${S.lang==='ur'?'آپ نے کہا':'You said'}: "<b>${esc(said)}</b>"<br>🎯 ${S.lang==='ur'?'ہدف':'Target'}: "<b>${esc(expected)}</b>"<br>${S.lang==='ur'?'مشق جاری رکھیں!':'Keep practicing!'}</div>`;};recog.onerror=()=>{box.innerHTML=`<div class="note">⚠️ ${S.lang==='ur'?'مائیک کی اجازت دیں':'Allow mic permission'}</div>`;};recog.start();}catch(e){box.innerHTML=`<div class="note">⚠️ Error</div>`;}}
/* ============ QUIZ ============ */
function rQuiz(){const lv=['beginner','intermediate','advanced'];
$('view').innerHTML=`<h2>❓ ${t('quiz')}</h2><p class="mut">${S.lang==='ur'?'اپنا امتحان لیں':'Test yourself'}</p>
${lv.map(l=>{const qs=[];LESSONS.filter(x=>x.level===l).forEach(x=>x.qz.forEach(q=>qs.push(q)));const best=S.scores['test_'+l];return `<div class="card"><h3>${t(l)} ${S.lang==='ur'?'ٹیسٹ':'Test'}</h3><p class="mut">${qs.length} ${S.lang==='ur'?'سوالات':'questions'}${best!=null?` • ${S.lang==='ur'?'بہترین':'Best'}: ${best}/${qs.length}`:''}</p><button class="btn big" onclick="go('quizrun',{level:'${l}'})">▶ ${S.lang==='ur'?'شروع کریں':'Start'}</button></div>`;}).join('')}`;}
let QQ=[],QQI=0,QQS=0;
function rQuizRun(){QQ=[];LESSONS.filter(x=>x.level===VP.level).forEach(x=>x.qz.forEach(q=>QQ.push(q)));QQ=QQ.sort(()=>Math.random()-.5);QQI=0;QQS=0;renderQQ();}
function renderQQ(){const q=QQ[QQI];if(!q){const pct=Math.round(QQS/QQ.length*100);const prev=S.scores['test_'+VP.level]||0;if(QQS>prev)S.scores['test_'+VP.level]=QQS;save();
const badge=pct>=80?'🏆':pct>=50?'👍':'💪';$('view').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:60px">${badge}</div><h2>${QQS}/${QQ.length} (${pct}%)</h2><p class="mut">${pct>=80?(S.lang==='ur'?'شاباش!':'Excellent!'):pct>=50?(S.lang==='ur'?'اچھا!':'Good!'):(S.lang==='ur'?'پھر کوشش کریں':'Try again')}</p><div class="row"><button class="btn" onclick="rQuizRun()">${S.lang==='ur'?'دوبارہ':'Retry'}</button><button class="btn ghost" onclick="go('quiz')">${t('quiz')}</button></div></div>`;return;}
$('view').innerHTML=`<div class="card"><p class="mut">Q${QQI+1}/${QQ.length} • ✅ ${QQS}</p><p style="font-size:17px;margin:10px 0"><b>${esc(q.q)}</b></p>${q.o.map((o,i)=>`<button class="quizopt" id="qq${i}" onclick="ansQQ(${i},${q.a},'${esc(q.xu).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}<div id="qx"></div></div>`;}
function ansQQ(i,a,x){QQ[QQI].o.forEach((_,j)=>{$('qq'+j).classList.add(j===a?'right':(j===i?'wrong':''));$('qq'+j).onclick=null;});if(i===a)QQS++;$('qx').innerHTML=`<div class="note">${i===a?'✅':'❌'} <span class="ur">${x}</span><br><button class="btn sm" style="margin-top:8px" onclick="QQI++;renderQQ()">${S.lang==='ur'?'اگلا':'Next'} →</button></div>`;}

function badges(){const b=[];const done=learnedCount();
b.push({n:'🔥 7-Day Streak',u:'7 دن لگاتار',ok:S.streak.c>=7});b.push({n:'📖 10 Lessons',u:'10 اسباق',ok:done>=10});
b.push({n:'📖 30 Lessons',u:'30 اسباق',ok:done>=30});b.push({n:'⭐ 50 Favorites',u:'50 پسندیدہ',ok:S.favs.length>=50});
b.push({n:'🏆 Quiz Master',u:'کوئز ماسٹر',ok:Object.values(S.scores).some(s=>s>=8)});b.push({n:'🔤 Word Explorer',u:'الفاظ کے متلاشی',ok:S.favs.length>=20});
return b;}
function rProgress(){const done=learnedCount();const bs=badges();const got=bs.filter(b=>b.ok).length;
$('view').innerHTML=`<h2>🏆 ${t('progress')}</h2>
<div class="card"><div class="row"><div class="stat"><b>${S.streak.c}</b><span>🔥 ${S.lang==='ur'?'دن لگاتار':'day streak'}</span></div><div class="stat"><b>${done}/30</b><span>📖 ${S.lang==='ur'?'اسباق':'lessons'}</span></div><div class="stat"><b>${S.favs.length}</b><span>⭐ ${S.lang==='ur'?'پسندیدہ':'favs'}</span></div></div>
<div class="bar"><i style="width:${done/30*100}%"></i></div></div>
<div class="card"><h2>🎖️ ${S.lang==='ur'?'اعزازات':'Badges'} (${got}/${bs.length})</h2>${bs.map(b=>`<span class="badge ${b.ok?'':'lock'}">${b.n}</span>`).join('')}</div>
<div class="card"><h2>📊 ${S.lang==='ur'?'کوئز اسکور':'Quiz Scores'}</h2>${['beginner','intermediate','advanced'].map(l=>`<p>${t(l)}: <b>${S.scores['test_'+l]!=null?S.scores['test_'+l]:'—'}</b></p>`).join('')||'<p class="mut">—</p>'}</div>
<div class="card"><button class="btn sm ghost" onclick="if(confirm('${S.lang==='ur'?'سب ڈیٹا صاف کریں؟':'Clear all data?'}')){localStorage.removeItem(SKEY);location.reload();}">${S.lang==='ur'?'ڈیٹا صاف کریں':'Reset Data'}</button>
<p class="mut" style="margin-top:8px">${S.lang==='ur'?'ڈیٹا اسی ڈیوائس کے براؤزر میں محفوظ ہے۔':'Data is stored in this device browser only.'}</p></div>`;}
