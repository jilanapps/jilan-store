<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a7a3c">
<title>Jilan Karyana Store — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo-banner"><span class="pill">DEMO</span><span id="banner-text">DEMO by Jilan Apps</span></div>

<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/>
          <path d="M2 3h3l2.6 12.5a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L20.5 8H6"/>
        </svg>
      </div>
      <div style="min-width:0">
        <div class="logo-name" id="hdr-shop">Jilan Karyana Store</div>
        <div class="logo-sub" id="hdr-hours"></div>
      </div>
    </div>
    <nav class="desktop-nav" id="desktop-nav"></nav>
    <button class="lang-btn" id="lang-btn" data-action="lang">اردو</button>
  </div>
</header>

<main class="container" id="view"></main>

<nav class="bottom-nav" id="bottom-nav"></nav>

<div class="footer-note" id="footer-note"></div>

<script src="app.js"></script>
</body>
</html>
